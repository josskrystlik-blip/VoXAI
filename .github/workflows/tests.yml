name: Tests fonctionnels

# Parcours utilisateur de bout en bout dans le navigateur (voir tests/e2e/), avec des serveurs
# simulés (Gemini, LLM et Whisper de l'entreprise, Confluence), un micro simulé et sans Internet :
#  - dictaphone : micro (pause, reprise, annulation, refus), import multi-pistes, synthèse,
#                 transcription, copies et exports, sauvegarde / restauration
#  - sur-site   : assistant de démarrage, réglages de l'administrateur, paramètres, Hybride, pannes
#  - series     : séries, suivi des actions, brief, échéances, e-mail aux participants
#  - assistant  : assistant IA, e-mails, corrections de synthèse, transcription en direct
#  - hors-ligne : application installable, utilisation sans réseau, mise à jour
#  - confluence : publication dans Confluence (Cloud et Data Center sur site)
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [dictaphone, sur-site, series, assistant, hors-ligne, confluence]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Installer Playwright (Chromium)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
      - run: node tests/e2e/${{ matrix.suite }}.test.js
