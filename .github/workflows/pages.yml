name: GitHub Pages

# Publie l'application web sur GitHub Pages à chaque mise à jour de main.
# Seuls les fichiers de l'interface sont publiés (pas les tests, ni la configuration Docker).
# Prérequis (une seule fois) : Settings → Pages → Source : « GitHub Actions ».
#
# Deux jobs séparés (modèle officiel GitHub) : le site est préparé et envoyé dans « build »,
# puis publié dans « deploy ». L'archive est ainsi enregistrée par GitHub avant d'être
# recherchée (dans un seul job, la publication pouvait ne pas la trouver).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7

      - name: Préparer le site
        run: |
          mkdir -p _site
          cp -r index.html theme-init.js app.js series.js db.js confluence.js live.js style.css vendor LICENSE .nojekyll _site/
          ls -la _site

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v5
