name: GitHub Pages

# Publie l'application web sur GitHub Pages à chaque mise à jour de main.
# Seuls les fichiers de l'interface sont publiés (pas les tests, ni la configuration Docker).
# Prérequis (une seule fois) : Settings → Pages → Source : « GitHub Actions ».
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Préparer le site
        run: |
          mkdir -p _site
          cp -r index.html theme-init.js app.js series.js db.js confluence.js live.js style.css vendor LICENSE .nojekyll _site/
          ls -la _site

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v5
