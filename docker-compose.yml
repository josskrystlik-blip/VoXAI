services:
  voxai:
    image: ghcr.io/josskrystlik-blip/voxai:latest
    build: .
    container_name: voxai
    ports:
      - "8080:80"
    environment:
      # Facultatif : publication Confluence sans configuration CORS
      # CONFLUENCE_URL: "https://confluence.mon-entreprise.fr"
      CONFLUENCE_URL: ""
      # Facultatif : réglages imposés / par défaut pour tous les utilisateurs
      # (guide complet : docs/DEPLOIEMENT-DOCKER.md). VOXAI_DISABLE_CLOUD=true impose le
      # 100 % sur site et limite les connexions du navigateur aux serveurs ci-dessous.
      # VOXAI_DISABLE_CLOUD: "true"
      # VOXAI_PROVIDER: "local"
      # VOXAI_LLM_URL: "https://ia.mon-entreprise.fr/v1"
      # VOXAI_LLM_MODEL: "gpt-oss-120b"
      # VOXAI_STT_MODE: "local"
      # VOXAI_STT_URL: "https://ia.mon-entreprise.fr/v1"
      # VOXAI_STT_MODEL: "whisper-large-v3"
    restart: unless-stopped
