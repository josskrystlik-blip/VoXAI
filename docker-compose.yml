services:
  voxai:
    image: ghcr.io/josskrystlik-blip/voxai:latest
    build: .
    container_name: voxai
    ports:
      - "8080:80"
    environment:
      # Facultatif : publication Confluence sans configuration CORS
      # CONFLUENCE_URL: "https://confluence.mon-entreprise.fr"
      CONFLUENCE_URL: ""
    restart: unless-stopped
