server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Pas de journalisation des requêtes : rien n'est conservé côté serveur
    access_log off;
    server_tokens off;
    autoindex off;

    # En-têtes de sécurité (CSP, anti-iframe…) générés au démarrage : docker/20-voxai-security.sh
    include /etc/nginx/voxai/security.conf;

    # Proxy Confluence et réglages par défaut (générés au démarrage selon les variables d'environnement)
    include /etc/nginx/voxai/*.locations;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Fichiers cachés (.git, .env…) jamais servis
    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        # add_header dans un bloc location remplace ceux du serveur : on les réinclut
        include /etc/nginx/voxai/security.conf;
    }
}
